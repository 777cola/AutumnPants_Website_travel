:root {
  --bg: #ffffff;

  --accent: #10B981;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-cn);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.container {
  text-align: center;
  padding: 2rem;
}
.icon {

  margin-bottom: 1.5rem;
  display: block;
}
h1 {

  font-size: 2.5rem;
  font-weight: 600;
  margin-bottom: 0.75rem;
  letter-spacing: -0.02em;
}
.status {
  display: inline-block;
  padding: 0.35rem 1.2rem;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 500;
  background: rgba(16,185,129,0.08);
  color: var(--accent);
  border: 1px solid rgba(16,185,129,0.15);
  margin-bottom: 1.5rem;
}
p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  line-height: 1.8;
  max-width: 400px;
  margin: 0 auto 2rem;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  font-size: 0.95rem;
  transition: opacity 0.2s;
}
.back-link:hover { opacity: 0.7; }
.back-link::before {
  content: '←';
  font-size: 1.1rem;
}
